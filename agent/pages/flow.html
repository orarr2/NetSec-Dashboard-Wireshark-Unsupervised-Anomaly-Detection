<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>NETSEC - Agent Flow (private)</title>
<style>
:root {
  --bg: #ecfeff; --card: #ffffff; --card2: #f0f9ff;
  --border: rgba(14, 165, 233, 0.22); --text: #0b1a2b; --mid: #334155; --dim: #64748b;
  --idle: #cbd5e1; --active: #0ea5e9; --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%;
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5;
  padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px
           max(16px, env(safe-area-inset-left));
  background: var(--card); border-bottom: 1px solid var(--border); }
header h1 { margin: 0; font-size: 19px; color: #0284c7; }
.badge { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .5px;
  background: rgba(34,197,94,.14); color: #15803d; }
.badge.paused { background: rgba(100,116,139,.14); color: var(--dim); }
#case { color: var(--dim); font: 12px ui-monospace, Consolas, Menlo, monospace; word-break: break-all; }
main { padding: 14px max(14px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom))
       max(14px, env(safe-area-inset-left)); max-width: 1100px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.node { background: var(--card); border: 1px solid var(--border); border-top: 4px solid var(--idle);
  border-radius: 12px; padding: 12px; min-height: 104px; }
.node .name { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.node .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
.node .cap { color: var(--mid); font-size: 12px; margin-top: 8px; word-break: break-word; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); flex: none; }
.node.active { border-top-color: var(--active); } .node.active .dot { background: var(--active);
  animation: pulse 1s ease-in-out infinite; }
.node.done { border-top-color: var(--ok); } .node.done .dot { background: var(--ok); }
.node.warn { border-top-color: var(--warn); } .node.warn .dot { background: var(--warn); }
.node.bad { border-top-color: var(--bad); } .node.bad .dot { background: var(--bad); }
@keyframes pulse { 50% { opacity: .25; } }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
  margin-top: 12px; }
.panel h3 { margin: 0 0 8px 0; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; }
#verdict { border-left: 6px solid var(--idle); }
#verdict.urgent, #verdict.human_review { border-left-color: var(--bad); }
#verdict.standard { border-left-color: var(--active); }
#verdict.monitor { border-left-color: var(--ok); }
#verdict.known_pattern { border-left-color: var(--dim); }
#action { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
#meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
#rationale { margin-top: 8px; color: var(--mid); word-break: break-word; }
#note { margin-top: 8px; color: var(--bad); font-size: 12px; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; background: var(--card2); border-radius: 8px;
  padding: 10px; color: var(--mid); font: 12px/1.45 ui-monospace, Consolas, Menlo, monospace; }
#error { color: var(--bad); font-size: 12px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
<header>
  <h1>NETSEC agent flow</h1>
  <span id="badge" class="badge paused">PAUSED</span>
  <span id="case"></span>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="panel" id="verdict">
    <h3>Verdict</h3>
    <div id="action">-</div>
    <div id="meta"></div>
    <div id="rationale"></div>
    <div id="note"></div>
  </div>
  <div class="panel">
    <h3>Live lines</h3>
    <pre id="lines">(no case yet)</pre>
  </div>
  <div id="error"></div>
</main>
<script>
const el = (id) => document.getElementById(id);
const only = new URLSearchParams(window.location.search).get("case");
// The agents in the order a case passes them. The supervisor routes between the workers.
const NODES = [
  ["sanitize", "Sanitize", "boundary defence"],
  ["signal_extractor", "Intake", "the analyst note"],
  ["supervisor", "Supervisor", "plan and budget"],
  ["profile_builder", "Perception", "finding profile"],
  ["rag_retriever", "Research", "sources for the technique"],
  ["decision", "Decision", "rule tree and floors"],
  ["approval_gate", "Approval gate", "waits on a human"],
];

function apiPath(path) {
  const here = window.location.pathname;
  const idx = here.lastIndexOf("/flow");
  return (idx >= 0 ? here.substring(0, idx) : "") + path;
}

async function get(path) {
  const r = await fetch(apiPath(path), { headers: { "Accept": "application/json" }, cache: "no-store" });
  if (!r.ok) throw new Error(r.status + " on " + path);
  return r.json();
}

function buildGrid() {
  for (const [id, name, sub] of NODES) {
    const card = document.createElement("div");
    card.className = "node"; card.id = "node-" + id;
    const head = document.createElement("div"); head.className = "name";
    const dot = document.createElement("span"); dot.className = "dot";
    const label = document.createElement("span"); label.textContent = name;
    head.append(dot, label);
    const subEl = document.createElement("div"); subEl.className = "sub"; subEl.textContent = sub;
    const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = "not run";
    card.append(head, subEl, cap);
    el("grid").appendChild(card);
  }
}

function describe(id, c) {
  // [state, caption] of a node that has spoken, from the content of its trace entry.
  switch (id) {
    case "sanitize":
      return c.suspicious ? ["bad", "suspicious input withheld"] : ["done", (c.strings_checked ?? 0) + " strings checked"];
    case "signal_extractor":
      if (!c.has_text) return ["done", "no analyst note"];
      if (c.suspicious) return ["bad", "suspicious note, not interpreted"];
      return (c.contradictions || []).length ? ["warn", "the note contradicts the engines"] : ["done", "note read"];
    case "supervisor":
      return c.force_action ? ["warn", "forced " + c.force_action]
        : ["done", "concern " + c.pipeline_concern + ", difficulty " + c.expected_difficulty];
    case "profile_builder":
      return ["done", (c.primary_technique || "no technique") + ", severity " + c.severity
        + ((c.catalogue || {}).match ? ", known pattern" : "")];
    case "rag_retriever":
      return c.skipped ? ["done", "skipped: no technique"]
        : [c.coverage === "no_match" ? "warn" : "done", c.coverage + ", " + (c.n_procedures ?? 0) + " source(s)"];
    case "decision": {
      const action = String(c.action || "?");
      const state = (action === "urgent" || action === "human_review") ? "bad" : "done";
      return [state, action.toUpperCase() + " priority " + c.priority + " (" + c.source + ")"
        + (c.floor_applied ? ", floor " + c.floor_reason : "")];
    }
    case "approval_gate":
      return ["warn", "waiting on a human (" + (c.approval_id || "?") + ")"];
  }
  return ["done", ""];
}

function render(rep) {
  const trace = rep.trace || [];
  const verdict = rep.verdict || {};
  const live = verdict.status === "queued" || verdict.status === "processing";
  const last = {};
  for (const entry of trace) last[entry.speaker] = entry.content || {};
  let reached = -1;
  NODES.forEach(([id], i) => { if (last[id]) reached = i; });
  NODES.forEach(([id], i) => {
    const card = el("node-" + id);
    let state = "idle", caption = live ? "waiting" : "not run";
    if (last[id]) [state, caption] = describe(id, last[id]);
    else if (live && i === reached + 1) { state = "active"; caption = "running"; }
    card.className = "node " + state;
    card.querySelector(".cap").textContent = caption;
  });

  el("badge").textContent = live ? "LIVE" : "PAUSED";
  el("badge").className = "badge" + (live ? "" : " paused");
  const md = rep.metadata || {};
  el("case").textContent = rep.case_id + "  " + (md.candidate_id || "") + "  session " + (md.session_id ?? "-");

  const action = verdict.action || "";
  el("verdict").className = "panel " + action;
  el("action").textContent = action ? action.toUpperCase().replace(/_/g, " ") : (live ? "running" : "-");
  el("meta").textContent = "priority " + (verdict.priority ?? "-") + "  status " + (verdict.status || "-")
    + (md.technique ? "  technique " + md.technique : "");
  el("rationale").textContent = verdict.rationale || "";
  // A budget guard or a failed pipeline has no agent card of its own; say it here.
  const guard = last["budget_guard"], pipeline = last["pipeline"];
  el("note").textContent = guard ? "budget guard: " + guard.reason
    : pipeline ? "pipeline: this run did not finish on its own and was routed to a human" : "";
  el("lines").textContent = (rep.trace_lines || []).slice(-14).join("\n") || "(no lines yet)";
}

async function tick() {
  try {
    let id = only;
    if (!id) {
      const items = (await get("/cases/history?limit=1")).items || [];
      if (!items.length) { el("lines").textContent = "(no case yet)"; el("error").textContent = ""; return; }
      id = items[0].case_id;
    }
    render(await get("/report/" + encodeURIComponent(id)));
    el("error").textContent = "";
  } catch (err) {
    el("error").textContent = "error: " + err.message + " (retrying)";
  }
}

buildGrid();
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
