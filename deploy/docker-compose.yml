# Generic analysis stack - committed template, no secrets.
# Values come from ./.env (cp .env.example .env). Services bind to
# ${TS_BIND} so nothing listens on a public interface (decision IDX-08):
# set TS_BIND to the VM's Tailscale IP, or leave the loopback default
# for a local smoke test. Any fork can deploy this as-is (spec section 9).
#
# Four services run the four-tier ecosystem: n8n (alerting), the ingest
# API (:8766), the analysis worker (queue -> detection -> reports), and
# retention (daily housekeeping). The judge_api HTTP wrapper is optional
# and off by default - the worker owns the queue path.

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${TS_BIND:-127.0.0.1}:5678:5678"
    environment:
      - N8N_HOST=${TS_BIND:-127.0.0.1}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${TZ:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow templates, importable via the n8n UI or the CLI:
      #   docker compose exec n8n n8n import:workflow \
      #     --input=/workflows/mvp_triage_email.json
      - ./n8n_workflows:/workflows:ro

  ingest_api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ingest
    restart: unless-stopped
    ports:
      - "${TS_BIND:-127.0.0.1}:8766:8766"
    environment:
      - NETSEC_DATA_ROOT=/srv/netsec
      - NETSEC_MAX_UPLOAD_GB=${NETSEC_MAX_UPLOAD_GB:-10}
    volumes:
      - ${NETSEC_DATA_ROOT:-/srv/netsec}:/srv/netsec

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      - NETSEC_DATA_ROOT=/srv/netsec
    volumes:
      - ${NETSEC_DATA_ROOT:-/srv/netsec}:/srv/netsec

  retention:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      - NETSEC_DATA_ROOT=/srv/netsec
    volumes:
      - ${NETSEC_DATA_ROOT:-/srv/netsec}:/srv/netsec
    command: ["python", "-m", "server.retention"]

  # Local zero-key LLM path - runs models on the VM's CPU (ARM 24GB
  # handles llama3.1:8b, gemma2:9b, qwen2.5:7b at ~2-3 tokens/sec).
  # Off by default; enable by uncommenting and running `docker compose
  # --profile ollama up -d ollama` OR just `docker compose up -d ollama`.
  # The worker reaches it at http://ollama:11434 (Docker internal DNS).
  # Add `ollama:llama3.1,ollama:qwen2.5` to LLM_JUDGE_PANEL to activate
  # in the panel. NOT exposed to Tailscale - only reachable inside the
  # docker network, which is the correct blast radius for an LLM.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Loopback-only exposure: sibling containers (worker) reach 11434 via
    # docker DNS, AND host processes on the VM itself (the RAG systemd
    # service, ad-hoc curl) can reach it at 127.0.0.1:11434. NOT bound to
    # ${TS_BIND} on purpose - keeping Ollama off the Tailscale interface
    # is the correct blast radius for a live LLM endpoint.
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      # Bind inside the container so the docker network can reach us.
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_models:/root/.ollama    # persist pulled models across restarts

  # judge_api:   # optional - HTTP wrapper around llm_judge/judge_cli.py
  #              # (:8765); the worker supersedes it for the queue path

  # Reverse proxy + single-sign-on for the whole stack (portal, RAG,
  # Companion, n8n). Basic auth from /etc/default/netsec-caddy.
  # ingest_api is DELIBERATELY not proxied - it has HMAC signing on
  # uploads and only the dashboard client hits it.
  caddy:
    image: caddy:2
    restart: unless-stopped
    # host network so Caddy can reach the Tailscale interface AND the
    # apps that bind to 100.68.246.54:xxxx (they refuse connections
    # from any other interface, including the docker bridges). Also
    # means no `ports:` block - Caddy binds :443 directly on the host,
    # and the app rules in Caddyfile listen on 100.68.246.54:443 so
    # nothing leaks to the public interface.
    network_mode: host
    environment:
      - BASIC_AUTH_USER=${BASIC_AUTH_USER}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  n8n_data:
  ollama_models:
  caddy_data:
  caddy_config:
