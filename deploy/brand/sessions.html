<!--
    NetSec Reports Browser. Lists every done session from
    /sessions.json with filters + one-click open of the report.
    Same Aurora look as the portal.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050f">
<title>NetSec Reports</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="preload" href="/brand/fonts/inter-tight-latin.woff2"
      as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/brand/netsec-brand.css">
<style>
    .wrap { max-width: 1160px; margin: 0 auto;
        padding: 24px max(20px, env(safe-area-inset-right))
                 calc(60px + env(safe-area-inset-bottom))
                 max(20px, env(safe-area-inset-left));
        text-align: center; }
    .hero { display: flex; align-items: center; justify-content: center;
        gap: 20px; margin: 22px 0 28px; padding: 22px 26px; border-radius: 22px;
        position: relative; }
    .hero img { height: 46px; }
    .hero h1 { margin: 0 0 4px; font-size: 22px; }
    .hero p { margin: 0; color: var(--ink-dim); font-size: 13px; }
    .hero .theme-btn { position: absolute; top: 12px; right: 12px;
        width: 36px; height: 36px; padding: 0; border-radius: 50%;
        font-size: 15px; line-height: 1; }

    .toolbar { display: flex; gap: 10px; margin: 0 auto 20px;
        flex-wrap: wrap; justify-content: center; align-items: center; }
    .toolbar input, .toolbar select {
        background: var(--glass-bg-strong);
        color: var(--ink);
        border: 1px solid var(--glass-border);
        border-radius: 10px; padding: 8px 12px;
        font-family: var(--font-sans); font-size: 13px;
    }
    .toolbar input { flex: 1 1 180px; min-width: 0; max-width: 340px; }
    .toolbar .count { color: var(--ink-dim); font-size: 12px;
        font-family: "SF Mono", monospace; }

    /* The glass shell moved from the <table> to a wrapper so mid-size
       screens can scroll the table sideways inside it instead of
       stretching the whole page. */
    .table-wrap { background: var(--glass-bg); border-radius: var(--radius-card);
        border: 1px solid var(--glass-border);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        overflow-x: auto; }
    .sessions-table { width: 100%; border-collapse: separate;
        border-spacing: 0; font-size: 13px; text-align: center; }
    .sessions-table th { color: var(--ink-dim); font-weight: 500;
        text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
        padding: 12px 10px; border-bottom: 1px solid var(--glass-border);
        font-family: "SF Mono", monospace; }
    .sessions-table td { padding: 12px 10px;
        border-bottom: 1px solid var(--glass-border);
        color: var(--ink); vertical-align: middle; }
    .sessions-table tr:last-child td { border-bottom: none; }
    .sessions-table tbody tr { cursor: pointer; }
    .sessions-table tbody tr:hover td { background: var(--glass-bg-strong); }
    .sessions-table a { color: var(--violet-bright); }
    .sessions-table .n { font-family: "SF Mono", monospace;
        color: var(--ink-dim); }
    .sessions-table td.file { color: var(--ink); text-align: left; }
    .counts-cell .cell-inner { display: flex; gap: 4px;
        justify-content: center; }

    .empty { padding: 60px 20px; color: var(--ink-mute); font-size: 14px; }

    @media (max-width: 640px) {
        .hero { flex-direction: column; gap: 12px; padding: 18px;
            padding-top: 26px; }
    }

    /* Phone layout: each row becomes a small card. Labels come from
       data-label so the markup stays a single table. */
    @media (max-width: 640px) {
        .sessions-table thead { display: none; }
        .sessions-table, .sessions-table tbody { display: block; }
        .sessions-table tbody tr { display: block; text-align: left;
            padding: 12px 14px; border-bottom: 1px solid var(--glass-border); }
        .sessions-table tbody tr:last-child { border-bottom: none; }
        .sessions-table td { display: flex; align-items: center;
            justify-content: space-between; gap: 12px;
            border-bottom: none; padding: 3px 0; font-size: 13px; }
        .sessions-table td::before { content: attr(data-label);
            color: var(--ink-dim); font-size: 11px; letter-spacing: 0.06em;
            text-transform: uppercase; font-family: "SF Mono", monospace; }
        .sessions-table td.file { display: block; font-size: 14.5px;
            font-weight: 500; margin-bottom: 6px; overflow-wrap: anywhere; }
        .sessions-table td.file::before { display: none; }
        .sessions-table td.open-cell { padding-top: 8px; }
        .sessions-table td.open-cell a { display: inline-block;
            padding: 8px 14px; border: 1px solid var(--glass-border);
            border-radius: 10px; background: var(--glass-bg-strong); }
    }
</style>
</head>
<body>
<div class="wrap">
    <header class="hero glass">
        <img src="/brand/netsec-logo.svg" alt="NETSEC" width="202" height="46">
        <div>
            <h1>Reports</h1>
            <p>Every analyzed session. Tap a row to open the full report.</p>
        </div>
        <button class="theme-btn" id="theme-btn" type="button"
                title="Toggle light/dark" aria-label="Toggle light/dark">&#x1F317;</button>
    </header>

    <div class="toolbar">
        <input type="search" id="q" placeholder="filter by file / sensor / id..."
               autocomplete="off">
        <select id="verdict-filter">
            <option value="">Any verdict</option>
            <option value="malicious">Has malicious</option>
            <option value="suspicious">Has suspicious</option>
            <option value="benign">Benign only</option>
        </select>
        <span class="count" id="count"></span>
        <a class="pill" href="/">Back to portal</a>
    </div>

    <div class="table-wrap" id="tbl-wrap">
    <table class="sessions-table" id="tbl">
        <thead>
            <tr>
                <th>#</th>
                <th>File</th>
                <th>Sensor</th>
                <th>Finished</th>
                <th>Packets</th>
                <th>Verdicts</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
    </div>
    <div id="empty" class="empty" style="display:none">No sessions match.</div>
</div>

<script>
// -------- theme toggle (same shared key as the portal) --------
(function initTheme() {
    let saved = null;
    try {
        saved = localStorage.getItem("netsec-theme")
            || localStorage.getItem("companion-theme")
            || localStorage.getItem("rag-theme");
    } catch (e) {}
    if (saved === "light") {
        document.documentElement.setAttribute("data-theme", "light");
    }
    syncThemeColor();
})();
function syncThemeColor() {
    const light = document.documentElement.getAttribute("data-theme") === "light";
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = light ? "#f4f2fa" : "#07050f";
}
document.getElementById("theme-btn").addEventListener("click", () => {
    const el = document.documentElement;
    const next = el.getAttribute("data-theme") === "light" ? "dark" : "light";
    if (next === "light") el.setAttribute("data-theme", "light");
    else el.removeAttribute("data-theme");
    try { localStorage.setItem("netsec-theme", next); } catch (e) {}
    syncThemeColor();
});

// -------- data + rendering --------
let ALL = [];
let LAST_STAMP = null;   // sessions.json updated_at of the last render

function pillCount(kind, n) {
    if (!n) return null;
    const cls = ({malicious: "red", suspicious: "amber", benign: "lime"})[kind] || "";
    const span = document.createElement("span");
    span.className = "pill " + cls;
    span.textContent = n + " " + kind[0];   // "3 m"
    span.title = n + " " + kind;
    return span;
}

// All cell content lands via textContent: file names come from user
// uploads, so they must never be parsed as HTML.
function td(text, cls, label) {
    const t = document.createElement("td");
    if (cls) t.className = cls;
    if (label) t.setAttribute("data-label", label);
    if (text !== null && text !== undefined) t.textContent = text;
    return t;
}

function render() {
    const q = (document.getElementById("q").value || "").toLowerCase();
    const vf = document.getElementById("verdict-filter").value;
    const rows = document.getElementById("rows");
    rows.innerHTML = "";
    let n = 0;
    for (const s of ALL) {
        const hay = ((s.file || "") + " " + (s.sensor || "") + " " + s.sid).toLowerCase();
        if (q && !hay.includes(q)) continue;
        if (vf === "malicious"  && !s.counts.malicious)  continue;
        if (vf === "suspicious" && !s.counts.suspicious) continue;
        if (vf === "benign") {
            if (s.counts.malicious || s.counts.suspicious) continue;
        }
        const tr = document.createElement("tr");
        tr.appendChild(td(String(s.sid), "n", "Session"));
        tr.appendChild(td(s.file || "(no filename)", "file", "File"));
        tr.appendChild(td(s.sensor || "-", null, "Sensor"));
        tr.appendChild(td(s.finished_at || "-", "n", "Finished"));
        tr.appendChild(td(s.n_pkts ? s.n_pkts.toLocaleString() : "-", "n",
                          "Packets"));
        const cell = td(null, "counts-cell", "Verdicts");
        const inner = document.createElement("div");
        inner.className = "cell-inner";
        for (const k of ["malicious", "suspicious", "benign"]) {
            const p = pillCount(k, s.counts[k]);
            if (p) inner.appendChild(p);
        }
        cell.appendChild(inner);
        tr.appendChild(cell);
        const open = td(null, "open-cell");
        const link = document.createElement("a");
        link.href = s.report_url;
        link.textContent = "Open";
        open.appendChild(link);
        tr.appendChild(open);
        // The whole row is a tap target (44px+ on phones); the inner
        // link keeps working for open-in-new-tab.
        tr.addEventListener("click", (ev) => {
            if (ev.target.closest("a")) return;
            window.location.href = s.report_url;
        });
        rows.appendChild(tr);
        n++;
    }
    document.getElementById("count").textContent = n + " / " + ALL.length + " sessions";
    document.getElementById("empty").style.display = n ? "none" : "block";
    document.getElementById("tbl-wrap").style.display = n ? "" : "none";
}

async function load() {
    if (document.hidden) return;
    try {
        const r = await fetch("/sessions.json", {cache: "no-store"});
        const d = await r.json();
        // Same payload as last time: leave the DOM alone so a reader
        // mid-scroll is not yanked around by an identical repaint.
        if (LAST_STAMP && d.updated_at === LAST_STAMP) return;
        LAST_STAMP = d.updated_at || null;
        ALL = d.sessions || [];
        render();
    } catch (e) {
        document.getElementById("empty").textContent =
            "Could not load /sessions.json - is the write-sessions timer running?";
        document.getElementById("empty").style.display = "block";
        document.getElementById("tbl-wrap").style.display = "none";
    }
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("verdict-filter").addEventListener("change", render);
load();
setInterval(load, 60000);
document.addEventListener("visibilitychange", () => {
    if (!document.hidden) load();
});
</script>
</body>
</html>
