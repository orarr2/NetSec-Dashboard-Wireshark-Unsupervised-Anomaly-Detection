<!--
    NetSec Reports Browser. Lists every done session from
    /sessions.json with filters + one-click open of the report.
    Same Aurora look as the portal.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050f">
<title>NetSec Reports</title>
<link rel="stylesheet" href="/brand/netsec-brand.css">
<style>
    .wrap { max-width: 1160px; margin: 0 auto; padding: 24px 20px 60px;
        text-align: center; }
    .hero { display: flex; align-items: center; justify-content: center;
        gap: 20px; margin: 22px 0 28px; padding: 22px 26px; border-radius: 22px; }
    .hero img { height: 46px; }
    .hero h1 { margin: 0 0 4px; font-size: 22px; }
    .hero p { margin: 0; color: var(--ink-dim); font-size: 13px; }

    .toolbar { display: flex; gap: 10px; margin: 0 auto 20px;
        flex-wrap: wrap; justify-content: center; align-items: center; }
    .toolbar input, .toolbar select {
        background: var(--glass-bg-strong);
        color: var(--ink);
        border: 1px solid var(--glass-border);
        border-radius: 10px; padding: 8px 12px;
        font-family: var(--font-sans); font-size: 13px;
    }
    .toolbar .count { color: var(--ink-dim); font-size: 12px;
        font-family: "SF Mono", monospace; }

    .sessions-table { width: 100%; border-collapse: separate;
        border-spacing: 0; font-size: 13px; text-align: center;
        background: var(--glass-bg); border-radius: var(--radius-card);
        border: 1px solid var(--glass-border);
        backdrop-filter: var(--glass-blur); overflow: hidden; }
    .sessions-table th { color: var(--ink-dim); font-weight: 500;
        text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
        padding: 12px 10px; border-bottom: 1px solid var(--glass-border);
        font-family: "SF Mono", monospace; }
    .sessions-table td { padding: 12px 10px;
        border-bottom: 1px solid var(--glass-border);
        color: var(--ink); vertical-align: middle; }
    .sessions-table tr:last-child td { border-bottom: none; }
    .sessions-table tr:hover td { background: var(--glass-bg-strong); }
    .sessions-table a { color: var(--violet-bright); }
    .sessions-table .n { font-family: "SF Mono", monospace;
        color: var(--ink-dim); }
    .sessions-table .file { text-align: left; }
    .counts-cell { display: flex; gap: 4px; justify-content: center; }

    .empty { padding: 60px 20px; color: var(--ink-mute); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
    <header class="hero glass">
        <img src="/brand/netsec-logo.svg" alt="NETSEC">
        <div>
            <h1>Reports</h1>
            <p>Every analyzed session. Click a row to open the full report.</p>
        </div>
    </header>

    <div class="toolbar">
        <input type="search" id="q" placeholder="filter by file / sensor / id...">
        <select id="verdict-filter">
            <option value="">Any verdict</option>
            <option value="malicious">Has malicious</option>
            <option value="suspicious">Has suspicious</option>
            <option value="benign">Benign only</option>
        </select>
        <span class="count" id="count"></span>
        <a class="pill" href="/">Back to portal</a>
    </div>

    <table class="sessions-table" id="tbl">
        <thead>
            <tr>
                <th>#</th>
                <th class="file" style="text-align:center">File</th>
                <th>Sensor</th>
                <th>Finished</th>
                <th>Packets</th>
                <th>Verdicts</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">No sessions match.</div>
</div>

<script>
let ALL = [];

function pillCount(kind, n) {
    if (!n) return "";
    const cls = ({malicious: "red", suspicious: "amber", benign: "lime"})[kind] || "";
    const span = document.createElement("span");
    span.className = "pill " + cls;
    span.textContent = n + " " + kind[0];   // "3 m"
    span.title = n + " " + kind;
    return span;
}

function render() {
    const q = (document.getElementById("q").value || "").toLowerCase();
    const vf = document.getElementById("verdict-filter").value;
    const rows = document.getElementById("rows");
    rows.innerHTML = "";
    let n = 0;
    for (const s of ALL) {
        const hay = ((s.file || "") + " " + (s.sensor || "") + " " + s.sid).toLowerCase();
        if (q && !hay.includes(q)) continue;
        if (vf === "malicious"  && !s.counts.malicious)  continue;
        if (vf === "suspicious" && !s.counts.suspicious) continue;
        if (vf === "benign") {
            if (s.counts.malicious || s.counts.suspicious) continue;
        }
        const tr = document.createElement("tr");
        const td = (html, cls) => {
            const t = document.createElement("td");
            if (cls) t.className = cls;
            if (typeof html === "string") t.innerHTML = html; else t.appendChild(html);
            return t;
        };
        tr.appendChild(td(String(s.sid), "n"));
        tr.appendChild(td(
            `<span style="color:var(--ink)">${s.file || "(no filename)"}</span>`,
            "file"));
        tr.appendChild(td(s.sensor || "-"));
        tr.appendChild(td(s.finished_at || "-", "n"));
        tr.appendChild(td(s.n_pkts ? s.n_pkts.toLocaleString() : "-", "n"));
        const cell = document.createElement("td");
        cell.className = "counts-cell";
        for (const k of ["malicious", "suspicious", "benign"]) {
            const p = pillCount(k, s.counts[k]);
            if (p) cell.appendChild(p);
        }
        tr.appendChild(cell);
        tr.appendChild(td(`<a href="${s.report_url}">Open</a>`));
        rows.appendChild(tr);
        n++;
    }
    document.getElementById("count").textContent = n + " / " + ALL.length + " sessions";
    document.getElementById("empty").style.display = n ? "none" : "block";
    document.getElementById("tbl").style.display = n ? "" : "none";
}

async function load() {
    try {
        const r = await fetch("/sessions.json", {cache: "no-store"});
        const d = await r.json();
        ALL = d.sessions || [];
        render();
    } catch (e) {
        document.getElementById("empty").textContent =
            "Could not load /sessions.json - is the write-sessions timer running?";
        document.getElementById("empty").style.display = "block";
        document.getElementById("tbl").style.display = "none";
    }
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("verdict-filter").addEventListener("change", render);
load();
setInterval(load, 60000);
</script>
</body>
</html>
